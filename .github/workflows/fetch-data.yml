name: Update charts & deploy

on:
  schedule:
    # Every 6 hours (minute 17 avoids the top-of-hour queue).
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Netlify after updating'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-charts-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.142.0'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube.js
        continue-on-error: true

      - name: Fetch Apple Music
        run: node scripts/fetch-apple.js
        continue-on-error: true

      - name: Fetch Deezer
        run: node scripts/fetch-deezer.js
        continue-on-error: true

      - name: Fetch Last.fm (optional)
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node scripts/fetch-lastfm.js
        continue-on-error: true

      - name: Build data (history, Global 200, artists, songs)
        run: node scripts/build-data.js

      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tgz -C /tmp hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Build site
        run: hugo --gc --minify

      - name: Commit data
        run: |
          git config user.name "musicmetrics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data store
          if git diff --staged --quiet; then echo "No data changes"; exit 0; fi
          git commit -q -m "data: charts update $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -q -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done

      - name: Deploy to Netlify
        if: ${{ github.event_name == 'schedule' || inputs.deploy }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets are missing. See README → Deployment."
            exit 1
          fi
          npx -y netlify-cli deploy --prod --dir=public --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" \
            --message "Charts update $(date -u +'%Y-%m-%d %H:%M') UTC" || {
            echo "::error::Netlify deploy failed. If the log says Unauthorized, create a new Personal Access Token at https://app.netlify.com/user/applications and update the NETLIFY_AUTH_TOKEN repository secret."
            exit 1
          }

      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
        if: ${{ success() && (github.event_name == 'schedule' || inputs.deploy) }}
        run: node scripts/indexnow.js
        continue-on-error: true
