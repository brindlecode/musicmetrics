name: Update charts & deploy

on:
  schedule:
    # Once a day. GitHub has been starting this schedule ~3 h late (22:03 UTC fired at
    # 01:03-01:17 UTC), so it is set to 19:03 UTC to land near 01:00 in Türkiye.
    - cron: '3 19 * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Netlify after updating'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-charts-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.142.0'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Read by the "report" job below.
    outputs:
      big: ${{ steps.sizes.outputs.big }}
      outcomes: |
        Fetch YouTube=${{ steps.youtube.outcome }}
        Fetch Apple Music=${{ steps.apple.outcome }}
        Fetch Deezer=${{ steps.deezer.outcome }}
        Fetch Spotify artist ids=${{ steps.wikidata.outcome }}
        Fetch Last.fm=${{ steps.lastfm.outcome }}
        Build data=${{ steps.data.outcome }}
        Build site=${{ steps.site.outcome }}
        Save data store=${{ steps.save.outcome }}
        Deploy to Netlify=${{ steps.deploy.outcome }}
        Ping IndexNow=${{ steps.indexnow.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The data store lives on its own branch, replaced by one fresh commit per
      # day, so the repository does not grow with every update.
      - name: Check out data store
        uses: actions/checkout@v4
        with:
          ref: store
          path: store
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch YouTube
        id: youtube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube.js
        continue-on-error: true

      - name: Fetch Apple Music
        id: apple
        run: node scripts/fetch-apple.js
        continue-on-error: true

      - name: Fetch Deezer
        id: deezer
        run: node scripts/fetch-deezer.js
        continue-on-error: true

      - name: Fetch Spotify artist ids (Wikidata, weekly)
        id: wikidata
        run: node scripts/fetch-wikidata-spotify.js
        continue-on-error: true

      - name: Fetch Last.fm (optional)
        id: lastfm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node scripts/fetch-lastfm.js
        continue-on-error: true

      - name: Build data (history, Global 200, artists, songs)
        id: data
        run: node scripts/build-data.js

      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tgz -C /tmp hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Build site
        id: site
        run: hugo --gc --minify

      - name: Back up data store
        uses: actions/upload-artifact@v4
        with:
          name: store-${{ github.run_id }}
          path: |
            store
            !store/raw
            !store/.git
          retention-days: 30

      # GitHub rejects files over 100 MB (that stopped the site on 2026-10-11).
      # Warn well before a store file gets there.
      - name: Check data store file sizes
        id: sizes
        run: |
          big=$(find store -path store/.git -prune -o -path store/raw -prune -o -type f -size +80M -printf '%s bytes  %p\n')
          if [ -n "$big" ]; then
            echo "::warning::Data store files over 80 MB (GitHub's limit is 100 MB):"
            echo "$big"
            { echo 'big<<EOF'; echo "$big"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          fi

      # If saving fails the site is still deployed with today's data;
      # "Report problems" below opens an issue and marks the run as failed.
      - name: Save data store
        id: save
        continue-on-error: true
        working-directory: store
        run: |
          git config user.name "musicmetrics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan fresh
          git add -A
          git commit -q -m "store: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f origin fresh:store

      - name: Deploy to Netlify
        id: deploy
        if: ${{ github.event_name == 'schedule' || inputs.deploy }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets are missing. See README → Deployment."
            exit 1
          fi
          npx -y netlify-cli deploy --prod --no-build --dir=public --timeout=5400 --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" \
            --message "Charts update $(date -u +'%Y-%m-%d %H:%M') UTC" || {
            echo "::error::Netlify deploy failed. If the log says Unauthorized, create a new Personal Access Token at https://app.netlify.com/user/applications and update the NETLIFY_AUTH_TOKEN repository secret."
            exit 1
          }

      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
        id: indexnow
        if: ${{ success() && (github.event_name == 'schedule' || inputs.deploy) }}
        run: node scripts/indexnow.js
        continue-on-error: true

  # Opens (or comments on) one GitHub issue when anything went wrong, so a
  # failure never goes unnoticed again; the repository owner gets an email.
  # A separate job, so it still runs when "update" hits its time limit.
  report:
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts
      - name: Report problems
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BIG: ${{ needs.update.outputs.big }}
          OUTCOMES: ${{ needs.update.outputs.outcomes }}
          JOB_STATUS: ${{ needs.update.result }}
        run: bash scripts/report-run.sh
