name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - store

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'data:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: store
          path: store
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: for f in scripts/*.js scripts/lib/*.js; do node --check "$f"; done
      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v0.142.0/hugo_extended_0.142.0_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tgz -C /tmp hugo && sudo mv /tmp/hugo /usr/local/bin/hugo
      - name: Generate site data from store/
        run: node scripts/build-data.js --offline
      - name: Build site
        run: hugo --gc --minify
