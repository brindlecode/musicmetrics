{{- $f := partialCached "func/faq.html" . .RelPermalink -}}
{{- with $f -}}
<section class="section" aria-labelledby="faq-h">
  <div class="section-head"><h2 id="faq-h">{{ i18n "faq" }}</h2></div>
  <div class="faq" style="border-top:0">
    {{- range $i, $x := . }}
    <details{{ if eq $i 0 }} open{{ end }}><summary>{{ $x.q }}</summary><div><p>{{ $x.a | safeHTML }}</p></div></details>
    {{- end }}
  </div>
</section>
{{- end -}}
