{{- $sec := .Section -}}
{{- $isGlobal := and (eq .Type "chart") (eq .Params.chart "global") -}}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="logo" href="{{ "/" | relLangURL }}" aria-label="MusicMetrics — {{ i18n "nav_home" }}">
      {{ partial "logo.html" . }}<span class="logo__word">Music<b>Metrics</b></span>
    </a>
    {{- partialCached "header-nav.html" . site.Language.Lang .Section .Type $isGlobal }}
    <div class="header-tools">
      <button class="search-trigger" type="button" data-open-search>{{ partialCached "icons.html" (dict "n" "search" "s" 16) "search" 16 }}<span>{{ i18n "search_placeholder" }}</span><kbd>/</kbd></button>
      <button class="icon-btn" type="button" data-open-search aria-label="{{ i18n "search" }}">{{ partialCached "icons.html" (dict "n" "search") "search" 20 }}</button>
      {{- partial "lang-menu.html" . }}
      <button class="icon-btn theme-toggle" type="button" aria-label="{{ i18n "toggle_theme" }}">{{ partialCached "icons.html" (dict "n" "moon") "moon" 20 }}{{ partialCached "icons.html" (dict "n" "sun") "sun" 20 }}</button>
    </div>
  </div>
</header>
