{{ define "main" }}
<div class="wrap layout layout--aside">
  <article>
    {{ partial "crumbs.html" . }}
    <header class="page-head">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="page-head__lede">{{ . }}</p>{{ end }}
      <div class="page-head__meta"><span>{{ i18n "last_reviewed" }} {{ .Lastmod | time.Format ":date_long" }}</span></div>
    </header>
    <div class="prose">{{ .Content }}</div>
  </article>
  {{ partialCached "aside.html" . site.Language.Lang }}
</div>
{{ end }}
