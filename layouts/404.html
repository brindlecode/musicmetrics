{{ define "main" }}
<div class="wrap layout">
  <div style="max-width:720px">
    <p class="kicker" style="margin-top:24px">404</p>
    <h1 style="font-size:clamp(2.4rem,7vw,4.5rem);margin:8px 0 12px">{{ i18n "not_found_title" }}</h1>
    <p class="page-head__lede">{{ i18n "not_found_text" }}</p>
    <div class="profile__actions"><button class="btn" type="button" data-open-search>{{ partialCached "icons.html" (dict "n" "search" "s" 16) "search" 16 }}{{ i18n "search" }}</button><a class="btn btn--ghost" href="{{ "/charts/global/" | relLangURL }}">{{ i18n "global_200" }}</a><a class="btn btn--ghost" href="{{ "/" | relLangURL }}">{{ i18n "nav_home" }}</a></div>
  </div>
</div>
{{ end }}
