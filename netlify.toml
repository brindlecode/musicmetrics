# Deploys normally come from GitHub Actions (prebuilt ./public, see
# .github/workflows/fetch-data.yml). These settings are only used if the
# site is ever linked to the repository for Netlify-side builds.
# Headers and redirects live in static/_headers and static/_redirects so
# they apply to both deploy methods.
[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.142.0"
  NODE_VERSION = "22"
