# ------------------------------------------------------------------- FAQ
faq_home_q1 = "What is the most popular song in the world right now?"
faq_home_a1 = "According to the MusicMetrics Global 200 ({{ .Date }}), the most popular song in the world right now is “{{ .Title }}” by {{ .Artist }}. It is charting in {{ .Countries }} countries on {{ .Charts }} charts across YouTube, Apple Music and Deezer."
faq_home_q2 = "How are the MusicMetrics charts calculated?"
faq_home_a2 = "We collect official public charts from YouTube, Apple Music and Deezer. Every position earns points weighted by platform and market size; the Global 200 ranks songs by their total points. The full formula is on the Methodology page."
faq_home_q3 = "How often are the charts updated?"
faq_home_a3 = "Every 6 hours. Movement arrows compare with the previous day, and we keep the history of every position to show peaks and days on chart."
faq_home_q4 = "Which countries and platforms are covered?"
faq_home_a4 = "{{ .Charts }} charts in {{ .Countries }} countries: YouTube trending music, Apple Music Top 100 songs and albums, Deezer Top 100 and, where available, Last.fm."
