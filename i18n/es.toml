faq_home_q2 = "¿Cómo se calculan las listas de MusicMetrics?"
faq_home_a2 = "Recopilamos las listas públicas oficiales de YouTube, Apple Music y Deezer. Cada posición suma puntos ponderados según la plataforma y el tamaño del mercado; el Global 200 ordena las canciones por sus puntos totales. La fórmula completa está en la página de Metodología."
faq_home_q3 = "¿Cada cuánto se actualizan las listas?"
faq_home_a3 = "Cada día. Las flechas de movimiento comparan con el día anterior, y guardamos el historial de cada posición para mostrar máximos y días en lista."
