# ------------------------------------------------------------------- FAQ
faq_home_q1 = "今、世界で最も人気の曲は？"
faq_home_a1 = "MusicMetrics Global 200（{{ .Date }}）によると、今、世界で最も人気の曲は{{ .Artist }}の「{{ .Title }}」です。YouTube、Apple Music、Deezerの{{ .Charts }}チャート、{{ .Countries }}か国でランクインしています。"
faq_home_q2 = "MusicMetricsのチャートはどのように算出されていますか？"
faq_home_a2 = "YouTube、Apple Music、Deezerの公式な公開チャートを収集しています。各順位にはプラットフォームと市場規模で重み付けしたポイントが与えられ、Global 200は合計ポイントで曲を順位付けします。計算式の詳細は算出方法のページをご覧ください。"
faq_home_q3 = "チャートはどのくらいの頻度で更新されますか？"
faq_home_a3 = "毎日です。順位変動の矢印は前日と比較しており、各順位の履歴を保存して最高順位とランクイン日数を表示しています。"
faq_home_q4 = "どの国とプラットフォームに対応していますか？"
faq_home_a4 = "{{ .Countries }}か国・{{ .Charts }}チャート：YouTube急上昇音楽、Apple Music Top 100（曲・アルバム）、Deezer Top 100、利用可能な場合はLast.fm。"
