faq_home_q2 = "Wie werden die MusicMetrics-Charts berechnet?"
faq_home_a2 = "Wir erfassen die offiziellen öffentlichen Charts von YouTube, Apple Music und Deezer. Jede Platzierung bringt Punkte, gewichtet nach Plattform und Marktgröße; die Global 200 sortieren Songs nach ihrer Gesamtpunktzahl. Die vollständige Formel steht auf der Methodik-Seite."
