faq_home_q2 = "Como as paradas do MusicMetrics são calculadas?"
faq_home_a2 = "Coletamos as paradas públicas oficiais do YouTube, Apple Music e Deezer. Cada posição rende pontos ponderados pela plataforma e pelo tamanho do mercado; o Global 200 classifica as músicas pelo total de pontos. A fórmula completa está na página de Metodologia."
