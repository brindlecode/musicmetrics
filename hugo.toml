baseURL = "https://musicmetrics.net/"
title = "MusicMetrics"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
timeZone = "UTC"
summaryLength = 30

[pagination]
  pagerSize = 100

[minify]
  [minify.tdewolff.html]
    keepQuotes = true

[markup.goldmark.renderer]
  unsafe = true

[sitemap]
  changeFreq = "daily"
  priority = 0.5

[mediaTypes."text/plain"]
  suffixes = ["txt"]

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.ADS]
    mediaType = "text/plain"
    baseName = "ads"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]

# ---------------------------------------------------------------- content --
# Every language has its own hand-written pages (content/<lang>) plus the
# shared, data-driven pages (content/_gen) generated from data/*.json via
# Hugo content adapters. Nothing in content/_gen needs translating.
[module]
  [[module.mounts]]
    source = "content/en"
    target = "content"
    lang = "en"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "en"
  [[module.mounts]]
    source = "content/tr"
    target = "content"
    lang = "tr"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "tr"
  [[module.mounts]]
    source = "content/es"
    target = "content"
    lang = "es"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "es"
  [[module.mounts]]
    source = "content/pt"
    target = "content"
    lang = "pt"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "pt"
  [[module.mounts]]
    source = "content/de"
    target = "content"
    lang = "de"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "de"
  [[module.mounts]]
    source = "content/fr"
    target = "content"
    lang = "fr"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "fr"
  [[module.mounts]]
    source = "content/ja"
    target = "content"
    lang = "ja"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "ja"

# -------------------------------------------------------------- languages --
[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 1
    [languages.en.params]
      homeCountry = "us"
      locale = "en_US"
      amazonDomain = "amazon.com"
  [languages.tr]
    languageName = "Türkçe"
