# ----------------------------------------------------------------- params --
[params]
  siteName = "MusicMetrics"
  themeColor = "#141412"
  contactEmail = "hello@musicmetrics.net"
  # Generated once; the key file lives at /static/<key>.txt (IndexNow: Bing, Yandex, Seznam, Naver).
  indexNowKey = "7c1f3a9e5b2d4e8f9a6c0b1d2e3f4a5b"

  # Repository used by the admin panel (/admin/) for upload and workflow links.
  [params.repo]
    name = "ilkukaya/musicmetrics"
    branch = "claude/analyze-kworb-metrics-2mIwb"
    netlifySite = "musicmetrics-net"

  # Spotify weekly charts: every market Spotify publishes, and the ones we
  # download each week (see /admin/). CSVs go to spotify/weekly/.
  [params.spotify]
    markets = ["global", "ae", "ar", "at", "au", "be", "bg", "bo", "br", "by", "ca", "ch", "cl", "co", "cr", "cy", "cz", "de", "dk", "do", "ec", "ee", "eg", "es", "fi", "fr", "gb", "gr", "gt", "hk", "hn", "hu", "id", "ie", "il", "in", "is", "it", "jp", "kr", "kz", "lt", "lu", "lv", "ma", "mx", "my", "ng", "ni", "nl", "no", "nz", "pa", "pe", "ph", "pk", "pl", "pt", "py", "ro", "sa", "se", "sg", "sk", "sv", "th", "tr", "tw", "ua", "us", "uy", "ve", "vn", "za"]
    recommended = ["global", "us", "gb", "de", "br", "mx", "fr", "es", "it", "nl", "pl", "ar", "id", "ph", "in", "tr"]

  [params.social]
    twitter = "musicmetricsnet"

  # Search engine verification codes (paste the "content" value only).
  [params.verify]
    google = ""
    bing = ""
    yandex = ""

  # Free analytics. Leave empty to disable.
  [params.analytics]
    ga4 = ""          # e.g. "G-XXXXXXXXXX"
    clarity = ""      # Microsoft Clarity project id
    cloudflare = ""   # Cloudflare Web Analytics token

  # Google AdSense. Set client to "ca-pub-XXXXXXXXXXXXXXXX" once approved.
  # With only the client set, Auto ads are used; add slot ids for manual units.
  [params.ads]
    adsenseClient = ""
    slotInline = ""
    slotSidebar = ""
    slotFooter = ""

  # Affiliate programs. Every value is optional; links still work without them.
  [params.affiliate]
    appleToken = ""       # Apple Services Performance Partners "at" token
    amazonTag = ""        # Amazon Associates tag, e.g. "musicmetrics-20"
    ticketsUrl = ""       # Ticket affiliate deep link; "{q}" is replaced by the artist name
