baseURL = "https://musicmetrics.net/"
title = "MusicMetrics"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
timeZone = "UTC"
summaryLength = 30

[pagination]
  pagerSize = 100

[minify]
  [minify.tdewolff.html]
    keepQuotes = true

[markup.goldmark.renderer]
  unsafe = true

[sitemap]
  changeFreq = "daily"
  priority = 0.5

[mediaTypes."text/plain"]
  suffixes = ["txt"]

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.ADS]
    mediaType = "text/plain"
    baseName = "ads"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]

# ---------------------------------------------------------------- content --
# Every language has its own hand-written pages (content/<lang>) plus the
# shared, data-driven pages (content/_gen) generated from data/*.json via
# Hugo content adapters. Nothing in content/_gen needs translating.
[module]
  [[module.mounts]]
    source = "content/en"
    target = "content"
    lang = "en"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "en"
  [[module.mounts]]
    source = "content/tr"
    target = "content"
    lang = "tr"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "tr"
  [[module.mounts]]
    source = "content/es"
    target = "content"
    lang = "es"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "es"
  [[module.mounts]]
    source = "content/pt"
    target = "content"
    lang = "pt"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "pt"
  [[module.mounts]]
    source = "content/de"
    target = "content"
    lang = "de"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "de"
  [[module.mounts]]
    source = "content/fr"
    target = "content"
    lang = "fr"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "fr"
  [[module.mounts]]
    source = "content/ja"
    target = "content"
    lang = "ja"
  [[module.mounts]]
    source = "content/_gen"
    target = "content"
    lang = "ja"

# -------------------------------------------------------------- languages --
[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 1
    [languages.en.params]
      homeCountry = "us"
      locale = "en_US"
      amazonDomain = "amazon.com"
  [languages.tr]
    languageName = "Türkçe"
    languageCode = "tr"
    weight = 2
    [languages.tr.params]
      homeCountry = "tr"
      locale = "tr_TR"
      amazonDomain = "amazon.com.tr"
  [languages.es]
    languageName = "Español"
    languageCode = "es"
    weight = 3
    [languages.es.params]
      homeCountry = "es"
      locale = "es_ES"
      amazonDomain = "amazon.es"
  [languages.pt]
    languageName = "Português"
    languageCode = "pt"
    weight = 4
    [languages.pt.params]
      homeCountry = "br"
      locale = "pt_BR"
      amazonDomain = "amazon.com.br"
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de"
    weight = 5
    [languages.de.params]
      homeCountry = "de"
      locale = "de_DE"
      amazonDomain = "amazon.de"
  [languages.fr]
    languageName = "Français"
    languageCode = "fr"
    weight = 6
    [languages.fr.params]
      homeCountry = "fr"
      locale = "fr_FR"
      amazonDomain = "amazon.fr"
  [languages.ja]
    languageName = "日本語"
    languageCode = "ja"
    weight = 7
    [languages.ja.params]
      homeCountry = "jp"
      locale = "ja_JP"
      amazonDomain = "amazon.co.jp"

# ----------------------------------------------------------------- params --
[params]
  siteName = "MusicMetrics"
  themeColor = "#141412"
  contactEmail = "hello@musicmetrics.net"
  # Generated once; the key file lives at /static/<key>.txt (IndexNow: Bing, Yandex, Seznam, Naver).
  indexNowKey = "7c1f3a9e5b2d4e8f9a6c0b1d2e3f4a5b"

  # Repository used by the admin panel (/admin/) for upload and workflow links.
  [params.repo]
    name = "brindlecode/musicmetrics"
    branch = "claude/analyze-kworb-metrics-2mIwb"
    netlifySite = "musicmetrics-net"

  # Spotify weekly charts: every market Spotify publishes, and the ones we
  # download each week (see /admin/). CSVs go to spotify/weekly/.
  [params.spotify]
    markets = ["global", "ae", "ar", "at", "au", "be", "bg", "bo", "br", "by", "ca", "ch", "cl", "co", "cr", "cy", "cz", "de", "dk", "do", "ec", "ee", "eg", "es", "fi", "fr", "gb", "gr", "gt", "hk", "hn", "hu", "id", "ie", "il", "in", "is", "it", "jp", "kr", "kz", "lt", "lu", "lv", "ma", "mx", "my", "ng", "ni", "nl", "no", "nz", "pa", "pe", "ph", "pk", "pl", "pt", "py", "ro", "sa", "se", "sg", "sk", "sv", "th", "tr", "tw", "ua", "us", "uy", "ve", "vn", "za"]
    recommended = ["global", "us", "gb", "de", "br", "mx", "fr", "es", "it", "nl", "pl", "ar", "id", "ph", "in", "tr"]

  [params.social]
    twitter = "musicmetricsnet"

  # Search engine verification codes (paste the "content" value only).
  [params.verify]
    google = ""
    bing = ""
    yandex = ""
    # Mitgo ad space / affiliate ownership verification.
    mitgo = "59c68571-4bb2-4a79-9347-621a46d06630"

  # Free analytics. Leave empty to disable.
  [params.analytics]
    # Google tag (gtm.js) from the GA4 web data stream. It already sends page
    # views to the stream's measurement id (G-4DK7E6SQDV), so leave ga4 empty
    # while this is set, or every page view is counted twice.
    googleTag = "GTM-TFX57NZ5"
    ga4 = ""          # e.g. "G-XXXXXXXXXX" (ignored while googleTag is set)
    clarity = ""      # Microsoft Clarity project id
    cloudflare = ""   # Cloudflare Web Analytics token

  # Google AdSense publisher id. It always feeds /ads.txt and the
  # google-adsense-account verification meta tag. The AdSense ad script itself
  # only loads when [params.advertising.adsense] enabled = true (see below).
  # Slot ids are only used by layouts/partials/ad.html (manual AdSense units).
  [params.ads]
    adsenseClient = "ca-pub-9110547384071189"
    slotInline = ""
    slotSidebar = ""
    slotFooter = ""

  # Affiliate programs. Every value is optional; links still work without them.
  [params.affiliate]
    appleToken = ""       # Apple Services Performance Partners "at" token
    amazonTag = ""        # Amazon Associates tag, e.g. "musicmetrics-20"
    ticketsUrl = ""       # Ticket affiliate deep link; "{q}" is replaced by the artist name

  # -------------------------------------------------------- advertising --
  # Central advertising switchboard. Read ADVERTISING_CONFIGURATION.md first.
  # Templates never contain vendor code: they render empty slot placeholders
  # (layouts/partials/advertising/slot.html) and assets/js/advertising.js fills
  # at most maxAdsPerPage of them, only after the visitor accepted advertising
  # cookies in the consent banner, only on musicmetrics.net, only on eligible
  # pages (layouts/partials/advertising/eligibility.html).
  [params.advertising]
    # Master switch / emergency shutdown: false removes every ad slot and
    # every advertising script from the next build (AdSense and Adsterra).
    enabled = true
    # The one provider allowed to fill slots: "adsterra", "adsense" or "none".
    provider = "adsterra"
    maxAdsPerPage = 2
    # Ads only ever load after an explicit "Accept" in the consent banner.
    respectConsent = true
    # Never enable: no adblock detection, no adult ads (also OFF in the dashboard).
    antiAdblock = false
    allowAdultAds = false
    # Viewports at least this wide use the "desktop" placement lists.
    desktopMinWidth = 1024
    # Real vendor scripts only load on these hosts (never on deploy previews,
    # branch deploys or localhost).
    allowedHosts = ["musicmetrics.net", "www.musicmetrics.net"]
    # Hugo environments that may emit ad code. `hugo server` is "development".
    environments = ["production"]
    # Sends ad_slot_* events to the existing Google tag (GA4), which keeps
    # obeying Consent Mode. Used for fill-rate monitoring.
    ga4Events = true

  [params.advertising.consent]
    # "global": everyone must opt in before ads load (default, strictest).
    # "regional": opt-in only where the browser time zone is in the EEA, UK or
    # Switzerland (or unknown); elsewhere ads load unless the visitor rejects.
    mode = "global"
    # Bump to ask everybody again after a material policy change.
    version = 1

  [params.advertising.adsterra]
    # Off until the live verification in ADSTERRA_INTEGRATION.md section 6 has
    # passed (loader behaviour could not be inspected from the build machine).
    enabled = false
    # While enabled = false, a browser that opened any page with
    # ?mm-ads-preview=on gets real ads (after consent) for owner checks;
    # ?mm-ads-preview=off ends it. Visitors are unaffected.
    ownerPreview = true
    websiteId = "6226100"
    [params.advertising.adsterra.units.leaderboard]
      enabled = true
      id = "32459344"
      type = "banner"
      key = "cc214508ace844d55261ffecb39dab1c"
      src = "https://bauval.org/22/cc214508ace844d55261ffecb39dab1c"
      width = 728
      height = 90
    [params.advertising.adsterra.units.mobileBanner]
      enabled = true
      id = "32459341"
      type = "banner"
      key = "29f652a74a0dcb4863974b3a3295c845"
      src = "https://bauval.org/22/29f652a74a0dcb4863974b3a3295c845"
      width = 320
      height = 50
    [params.advertising.adsterra.units.mediumRectangle]
      enabled = true
      id = "32459342"
      type = "banner"
      key = "3d5a3cce6a4902147f0630529efadbc7"
      src = "https://bauval.org/22/3d5a3cce6a4902147f0630529efadbc7"
      width = 300
      height = 250
    # Kept disabled: the only sidebar (.aside) is sticky, and sticky ads are
    # not allowed. Needs a non-sticky placement before it can be enabled.
    [params.advertising.adsterra.units.wideSkyscraper]
      enabled = false
      id = "32459343"
      type = "banner"
      key = "899922d170840173a62ac9d2bd1077eb"
      src = "https://bauval.org/22/899922d170840173a62ac9d2bd1077eb"
      width = 160
      height = 600
    # Native Banner, layout 4:1, font size and colour "Inherit" (dashboard).
    [params.advertising.adsterra.units.nativeBanner]
      enabled = true
      id = "32459340"
      type = "native"
      key = "c7dd716ce6f6c63289752773346124cb"
      src = "https://bauval.org/21/c7dd716ce6f6c63289752773346124cb"
      width = 300
      height = 220

  # Google AdSense stays verified (ads.txt + meta tag) but sends no ad
  # requests while the site is not approved. Turn on only after approval and
  # after setting provider = "adsense" (a Google-certified CMP is required in
  # the EEA/UK/CH before that).
  [params.advertising.adsense]
    enabled = false
    publisherId = "ca-pub-9110547384071189"

  # Placeholder for direct sponsorships; nothing renders yet.
  [params.advertising.sponsorship]
    enabled = false

  # Extra ads.txt lines. Add ONLY lines copied from the Adsterra dashboard or
  # given by Adsterra support in writing. Adsterra's help centre says it does
  # not require ads.txt, so this is empty.
  [params.advertising.adsTxt]
    extra = []

  # Placement inventory per page type (from eligibility.html). Each slot lists
  # the units to try, in order, for desktop and for mobile/tablet widths; the
  # first one that fits the slot's real width is used, otherwise the slot is
  # skipped. A page type may not list more slots per device than maxAdsPerPage.
  [params.advertising.pages.home.top]
    desktop = ["leaderboard"]
    mobile = ["mobileBanner"]
  [params.advertising.pages.home.mid]
    desktop = ["nativeBanner"]
    mobile = ["mediumRectangle"]
  [params.advertising.pages.global200.top]
    desktop = ["leaderboard"]
    mobile = ["mobileBanner"]
  [params.advertising.pages.global200.list]
    desktop = ["mediumRectangle"]
    mobile = ["mediumRectangle"]
  [params.advertising.pages.country.top]
    desktop = ["leaderboard"]
    mobile = ["mobileBanner"]
  [params.advertising.pages.country.mid]
    desktop = ["nativeBanner"]
    mobile = ["mediumRectangle"]
  [params.advertising.pages.platform.top]
    desktop = ["leaderboard"]
    mobile = ["mobileBanner"]
  [params.advertising.pages.platform.list]
    desktop = ["mediumRectangle"]
    mobile = ["mediumRectangle"]
  [params.advertising.pages.artist.mid]
    desktop = ["mediumRectangle"]
    mobile = ["mediumRectangle"]
  [params.advertising.pages.artist.end]
    desktop = ["nativeBanner"]
    mobile = []
  [params.advertising.pages.song.mid]
    desktop = ["mediumRectangle"]
    mobile = ["mediumRectangle"]
  [params.advertising.pages.research.top]
    desktop = ["leaderboard"]
    mobile = ["mobileBanner"]
  [params.advertising.pages.research.mid]
    desktop = ["nativeBanner"]
    mobile = ["mediumRectangle"]
